<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1324" />
      <stop offset="55%" stop-color="#151C36" />
      <stop offset="100%" stop-color="#1E2547" />
    </linearGradient>
    <radialGradient id="amberGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 55) rotate(135) scale(290 190)">
      <stop offset="0%" stop-color="#F5B841" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#E89C38" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0E1324" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="indigoGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(130 190) rotate(-25) scale(340 160)">
      <stop offset="0%" stop-color="#8FA1F7" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#0E1324" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldRule" x1="48" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5B841" />
      <stop offset="65%" stop-color="#8FA1F7" />
      <stop offset="100%" stop-color="#8FA1F7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Main Frame -->
  <rect x="1" y="1" width="898" height="218" rx="14" fill="url(#bgGrad)" stroke="#2D3866" stroke-width="2" />
  <rect x="1" y="1" width="898" height="218" rx="14" fill="url(#amberGlow)" />
  <rect x="1" y="1" width="898" height="218" rx="14" fill="url(#indigoGlow)" />

  <!-- Subtle Technical Grid Lines -->
  <g stroke="#8FA1F7" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="55" x2="900" y2="55" />
    <line x1="0" y1="110" x2="900" y2="110" />
    <line x1="0" y1="165" x2="900" y2="165" />
    <line x1="620" y1="0" x2="620" y2="220" />
    <line x1="760" y1="0" x2="760" y2="220" />
  </g>

  <!-- Top Status Pill -->
  <rect x="48" y="34" width="248" height="26" rx="13" fill="#1B2342" stroke="#F5B841" stroke-opacity="0.45" />
  <circle cx="66" cy="47" r="4" fill="#F5B841" />
  <text x="80" y="51" fill="#F3D9A4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.1">CANBOARSEE • ON THE LINE</text>

  <!-- Name & Subtitle -->
  <text x="48" y="106" fill="#F8FAFC" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">Khen Borce</text>
  <text x="275" y="106" fill="#F5B841" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600">@BorceKhen</text>

  <rect x="48" y="122" width="380" height="2.5" rx="1.25" fill="url(#goldRule)" />

  <text x="48" y="152" fill="#CBD5E1" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15.5" font-weight="500">
    Building offline Android &amp; Windows utilities, accessible web apps, and tactile UIs.
  </text>

  <!-- Focus Tags -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">
    <rect x="48" y="170" width="94" height="24" rx="6" fill="#1A2240" stroke="#364478" />
    <text x="95" y="186" text-anchor="middle" fill="#8FA1F7">KOTLIN</text>

    <rect x="152" y="170" width="144" height="24" rx="6" fill="#1A2240" stroke="#364478" />
    <text x="224" y="186" text-anchor="middle" fill="#F5B841">JETPACK COMPOSE</text>

    <rect x="306" y="170" width="112" height="24" rx="6" fill="#1A2240" stroke="#364478" />
    <text x="362" y="186" text-anchor="middle" fill="#8FA1F7">PYTHON • WEB</text>
  </g>

  <!-- Right Motif: Subtle Amber Signal Rings + Retro Receiver Silhouette (nod to PFP) -->
  <g transform="translate(755 110)">
    <circle cx="0" cy="0" r="68" stroke="#F5B841" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="0" cy="0" r="46" stroke="#8FA1F7" stroke-opacity="0.28" stroke-width="1.5" />
    <circle cx="0" cy="0" r="24" fill="#1B2342" stroke="#F5B841" stroke-opacity="0.65" stroke-width="1.5" />
    <path d="M-9 -6 C-12 2 -2 12 6 9 L10 5 L5 1 L2 4 C-1 2 -2 1 -4 -2 L-1 -5 L-5 -10 Z" fill="#F5B841" />
    <path d="M9 -12 C15 -6 15 4 9 10" stroke="#8FA1F7" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M15 -18 C24 -9 24 7 15 16" stroke="#F5B841" stroke-opacity="0.65" stroke-width="1.8" stroke-linecap="round" fill="none" />
  </g>
</svg>
