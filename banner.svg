<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="bannerClip">
      <rect x="2" y="2" width="896" height="216" rx="13" />
    </clipPath>
    <linearGradient id="hsoBg" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09101D" />
      <stop offset="55%" stop-color="#0F1B2E" />
      <stop offset="100%" stop-color="#132A3A" />
    </linearGradient>
    <radialGradient id="cyanArcGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 110) rotate(135) scale(300 200)">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#09101D" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="amberRimGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(115 45) rotate(30) scale(260 140)">
      <stop offset="0%" stop-color="#F5C542" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#09101D" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="chargeHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="38%" stop-color="#00E5FF" stop-opacity="0.82" />
      <stop offset="72%" stop-color="#F5C542" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="boltAccent" x1="48" y1="0" x2="450" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5C542" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2D8B94" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Main Tactical Frame -->
    <rect x="0" y="0" width="900" height="220" fill="url(#hsoBg)" />
    <rect x="0" y="0" width="900" height="220" fill="url(#cyanArcGlow)" />
    <rect x="0" y="0" width="900" height="220" fill="url(#amberRimGlow)" />

    <!-- Subtle HSO Tactical Grid & Teal Diagonal Accent -->
    <g stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1">
      <line x1="0" y1="55" x2="900" y2="55" />
      <line x1="0" y1="110" x2="900" y2="110" />
      <line x1="0" y1="165" x2="900" y2="165" />
      <line x1="600" y1="0" x2="600" y2="220" />
      <line x1="760" y1="0" x2="760" y2="220" />
    </g>
    <polygon points="845,1 899,1 899,88" fill="#2D8B94" fill-opacity="0.22" />
    <line x1="0" y1="18" x2="18" y2="0" stroke="#F5C542" stroke-opacity="0.45" stroke-width="2" />

    <!-- Top HSO-S6 Style ID Badge -->
    <rect x="48" y="32" width="232" height="26" rx="5" fill="#111E33" stroke="#38BDF8" stroke-opacity="0.55" />
    <rect x="48" y="32" width="66" height="26" rx="5" fill="#F5C542" />
    <text x="81" y="49" text-anchor="middle" fill="#09101D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="800">HSO-S6</text>
    <text x="126" y="49" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.9">CANBOARSEE • HAND</text>

    <!-- Name & Handle -->
    <text x="48" y="106" fill="#F8FAFC" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">Khen Borce</text>
    <text x="278" y="106" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">@BorceKhen</text>

    <rect x="48" y="121" width="400" height="2.5" rx="1.25" fill="url(#boltAccent)" />

    <text x="48" y="151" fill="#CBD5E1" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15.5" font-weight="500">
      Building offline Android &amp; Windows utilities, accessible web apps, and tactile UIs.
    </text>

    <!-- Focus Tags -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">
      <rect x="48" y="169" width="96" height="24" rx="5" fill="#101D30" stroke="#2D8B94" />
      <text x="96" y="185" text-anchor="middle" fill="#67E8F9">KOTLIN</text>

      <rect x="154" y="169" width="146" height="24" rx="5" fill="#101D30" stroke="#F5C542" stroke-opacity="0.6" />
      <text x="227" y="185" text-anchor="middle" fill="#F5C542">JETPACK COMPOSE</text>

      <rect x="310" y="169" width="118" height="24" rx="5" fill="#101D30" stroke="#2D8B94" />
      <text x="369" y="185" text-anchor="middle" fill="#38BDF8">PYTHON • WEB</text>
    </g>

    <!-- Animated HSO-S6 Electric Bow Stage (Pure SMIL for GitHub) -->
    <g transform="translate(755 110)">
      <!-- Outer HUD Ring (brightens during charge) -->
      <circle cx="0" cy="0" r="70" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="7 5" fill="none">
        <animate attributeName="stroke-opacity" values="0.20;0.20;0.82;0.82;0.20;0.20" keyTimes="0;0.14;0.42;0.48;0.64;1" dur="3.6s" repeatCount="indefinite" />
      </circle>

      <!-- Electric Charge Orb gathering on draw -->
      <circle cx="-20" cy="0" r="0" fill="url(#chargeHalo)" opacity="0">
        <animate attributeName="cx" values="-20;-20;-42;-42;-20;-20" keyTimes="0;0.14;0.42;0.48;0.56;1" dur="3.6s" repeatCount="indefinite" />
        <animate attributeName="r" values="0;0;26;28;0;0" keyTimes="0;0.14;0.42;0.48;0.54;1" dur="3.6s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0;0.92;0.95;0;0" keyTimes="0;0.14;0.42;0.48;0.54;1" dur="3.6s" repeatCount="indefinite" />
      </circle>

      <!-- Dynamic Bowstring pulling back smoothly then snapping -->
      <path d="M-24 -56 L-24 0 L-24 56" stroke="#67E8F9" stroke-opacity="0.72" stroke-width="1.6" fill="none">
        <animate attributeName="d"
          values="M-24 -56 L-24 0 L-24 56; M-24 -56 L-24 0 L-24 56; M-24 -56 L-48 0 L-24 56; M-24 -56 L-48 0 L-24 56; M-24 -56 L-17 0 L-24 56; M-24 -56 L-24 0 L-24 56"
          keyTimes="0;0.14;0.42;0.48;0.55;1"
          dur="3.6s" repeatCount="indefinite" />
      </path>

      <!-- Bow Limbs (pulses thicker under electric charge) -->
      <path d="M-24 -56 C24 -36 24 36 -24 56" stroke="#00E5FF" stroke-linecap="round" fill="none">
        <animate attributeName="stroke-width" values="3.2;3.2;4.8;4.8;3.2;3.2" keyTimes="0;0.14;0.42;0.48;0.58;1" dur="3.6s" repeatCount="indefinite" />
      </path>

      <!-- Ambient Lightning Sparks flaring during charge/launch -->
      <path d="M-54 -22 L-38 -12 L-46 -4 L-30 6" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <animate attributeName="opacity" values="0.45;0.45;1;1;0.45;0.45" keyTimes="0;0.14;0.42;0.52;0.65;1" dur="3.6s" repeatCount="indefinite" />
      </path>
      <path d="M36 -38 L44 -22 L34 -18 L46 -4" stroke="#67E8F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <animate attributeName="opacity" values="0.45;0.45;1;1;0.45;0.45" keyTimes="0;0.14;0.42;0.52;0.65;1" dur="3.6s" repeatCount="indefinite" />
      </path>

      <!-- Electric Charge Bolt Arrow + Lightning Trail -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 0 0; -24 0; -24 0; 185 0; 185 0; 0 0; 0 0"
          keyTimes="0;0.14;0.42;0.48;0.64;0.76;0.78;1"
          dur="3.6s" repeatCount="indefinite" />
        <animate attributeName="opacity"
          values="1;1;1;1;1;0;0;1"
          keyTimes="0;0.14;0.42;0.48;0.59;0.65;0.78;0.90"
          dur="3.6s" repeatCount="indefinite" />

        <!-- Crackling cyan trail attached to arrow tail during flight -->
        <path d="M-110 0 L-76 -8 L-60 6 L-38 -5 L-22 0" stroke="#00E5FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0">
          <animate attributeName="opacity" values="0;0;0;0.35;0.95;0;0" keyTimes="0;0.42;0.47;0.49;0.55;0.64;1" dur="3.6s" repeatCount="indefinite" />
        </path>

        <!-- Gold Arrow Shaft & Head -->
        <path d="M-36 0 L34 0" stroke="#F5C542" stroke-width="2.8" stroke-linecap="round" />
        <path d="M22 -7 L38 0 L22 7 Z" fill="#F5C542" />
      </g>

      <!-- Launch Shockwave Ring -->
      <circle cx="14" cy="0" r="10" stroke="#00E5FF" stroke-width="2.2" fill="none" opacity="0">
        <animate attributeName="r" values="10;10;10;66;66;10" keyTimes="0;0.46;0.48;0.64;0.66;1" dur="3.6s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0;0.85;0;0;0" keyTimes="0;0.47;0.49;0.64;0.66;1" dur="3.6s" repeatCount="indefinite" />
      </circle>

      <!-- 4-point Sparkle Stars -->
      <path d="M-52 -44 L-49 -36 L-41 -33 L-49 -30 L-52 -22 L-55 -30 L-63 -33 L-55 -36 Z" fill="#67E8F9" fill-opacity="0.85" />
      <path d="M44 26 L46 32 L52 34 L46 36 L44 42 L42 36 L36 34 L42 32 Z" fill="#F5C542" fill-opacity="0.85" />
    </g>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="1" y="1" width="898" height="218" rx="14" stroke="#1E3A5F" stroke-width="2" fill="none" />
</svg>
